<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archiv Taranto</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe/dist/photoswipe.css">
    <style>
        :root { --primary: #ff4500; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; background: #fff; color: #000; overflow-x: hidden; }
        
        /* Hlavní kontejner pro mapu */
        #viewport { 
            width: 100vw; 
            height: 60vh; /* Mapa zabere 60% výšky, zbytek je pro odkazy */
            position: relative; 
            overflow: hidden; 
            background: #eee;
            touch-action: none; /* Důležité pro vlastní gesta */
            border-bottom: 2px solid #000;
        }

        #wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        .map-image { 
            height: 60vh; /* Základní výška odpovídá viewportu */
            width: auto; 
            display: block;
        }
        
        .hotspot { 
            position: absolute; width: 28px; height: 28px; 
            background: rgba(255, 69, 0, 0.6); border: 2px solid #000; 
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 10;
        }

        /* Sekce s odkazy pod mapou */
        .links-container {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        @media (max-width: 500px) { .links-container { grid-template-columns: 1fr; } }

        .link-item {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            color: #000;
            font-weight: 500;
            background: #f9f9f9;
            cursor: pointer;
        }
        .link-item:active { background: #eee; }

        /* Ovládací prvky */
        .controls {
            position: absolute; bottom: 15px; right: 15px;
            display: flex; flex-direction: column; gap: 8px; z-index: 80;
        }
        .btn {
            width: 44px; height: 44px; background: #fff; border: 2px solid #000;
            font-size: 20px; font-weight: bold; border-radius: 50%;
        }

        #hint-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.5); display: flex; justify-content: center; 
            align-items: center; z-index: 100; pointer-events: none; transition: opacity 0.5s;
        }
        .hint-box { background: #fff; padding: 15px; border: 2px solid #000; border-radius: 10px; text-align: center; }

        /* Galerie mřížka */
        #gallery-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 15px; margin-top: 60px; }
        .thumb { border: 1px solid #000; line-height: 0; }
        .thumb img { width: 100%; height: 140px; object-fit: cover; }
        .close-btn { position: fixed; top: 10px; right: 10px; width: 45px; height: 45px; background: #000; color: #fff; border-radius: 50%; border: none; font-size: 24px; z-index: 1100; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="hint-overlay">
            <div class="hint-box">
                <img src="https://img.icons8.com/ios/50/pinch-zoom-in.png" style="width:40px"><br>
                <small>ZOOM & PAN</small>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="doZoom(1.4)">+</button>
            <button class="btn" onclick="doZoom(0.7)">-</button>
        </div>

        <div id="wrapper">
            <img src="planek.jpg" class="map-image" id="mapImg">
            <div class="hotspot" style="top: 56%;left: 33%;" onclick="otevritMrizku('1mostotaceci')"></div>
            <div class="hotspot" style="top: 56%;left: 69%;" onclick="otevritMrizku('1novykostelamost')"></div>
            <div class="hotspot" style="top: 73%;left: 44%;" onclick="otevritMrizku('1okolibytu')"></div>
            <div class="hotspot" style="top: 60%;left: 41%;" onclick="otevritMrizku('1pesizona')"></div>
            </div>
    </div>

    <div class="links-container">
        <div class="link-item" onclick="otevritMrizku('1mostotaceci')">Most Otočný / Bridge</div>
        <div class="link-item" onclick="otevritMrizku('1novykostelamost')">Nový kostel / Church</div>
        <div class="link-item" onclick="otevritMrizku('1okolibytu')">Okolí bytu / Apartment</div>
        <div class="link-item" onclick="otevritMrizku('4armada')">Armáda / Army</div>
        <div class="link-item" onclick="otevritMrizku('4celkovepohledy')">Celkové pohledy / Views</div>
        <div class="link-item" onclick="otevritMrizku('4nevim')">Ostatní / Other</div>
    </div>

    <div id="gallery-overlay">
        <button class="close-btn" onclick="zavritMrizku()">×</button>
        <div class="grid" id="thumbnail-grid"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe/dist/photoswipe-lightbox.esm.js';

        const ZKRATKY = { "1mostotaceci":"most", "1novykostelamost":"kost", "1okolibytu":"byt", "4armada":"arm", "4celkovepohledy":"celk", "4nevim":"ost" };

        // --- ZOOM LOGIKA ---
        const view = document.getElementById('viewport');
        const wrap = document.getElementById('wrapper');
        let scale = 1, x = 0, y = 0;

        const mc = new Hammer.Manager(view);
        mc.add(new Hammer.Pinch());
        mc.add(new Hammer.Pan({ threshold: 0 }));

        mc.on("pinchstart panstart", () => {
            document.getElementById('hint-overlay').style.opacity = '0';
        });

        mc.on("panmove", (e) => {
            wrap.style.transform = `translate(${x + e.deltaX}px, ${y + e.deltaY}px) scale(${scale})`;
        });

        mc.on("panend", (e) => {
            x += e.deltaX; y += e.deltaY;
        });

        mc.on("pinchmove", (e) => {
            const newScale = Math.max(1, Math.min(scale * e.scale, 4));
            wrap.style.transform = `translate(${x}px, ${y}px) scale(${newScale})`;
        });

        mc.on("pinchend", (e) => {
            scale = Math.max(1, Math.min(scale * e.scale, 4));
        });

        window.doZoom = (s) => {
            document.getElementById('hint-overlay').style.opacity = '0';
            scale = Math.max(1, Math.min(scale * s, 4));
            wrap.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        };

        // --- GALERIE ---
        window.otevritMrizku = async function(slozka) {
            const grid = document.getElementById('thumbnail-grid');
            grid.innerHTML = 'Načítám...';
            document.getElementById('gallery-overlay').style.display = 'block';
            const zkratka = ZKRATKY[slozka];
            let fotkyArray = [];
            grid.innerHTML = '';

            for (let i = 1; i <= 250; i++) {
                const cislo = i.toString().padStart(3, '0');
                const path = `galerie/${slozka}/${cislo}${zkratka}.jpg`;
                const res = await fetch(path, { method: 'HEAD' });
                if (res.ok) {
                    const currentIdx = fotkyArray.length;
                    fotkyArray.push({ src: path, w: 1200, h: 800 }); // Rozměry se doladí při otevření
                    const d = document.createElement('div');
                    d.className = 'thumb';
                    d.innerHTML = `<img src="${path}" loading="lazy">`;
                    d.onclick = () => {
                        const lb = new PhotoSwipeLightbox({
                            dataSource: fotkyArray,
                            pswpModule: () => import('https://unpkg.com/photoswipe/dist/photoswipe.esm.js')
                        });
                        lb.init(); lb.loadAndOpen(currentIdx);
                    };
                    grid.appendChild(d);
                } else if (i > 10 && i % 20 === 0) break;
            }
        };

        window.zavritMrizku = () => document.getElementById('gallery-overlay').style.display = 'none';
    </script>
</body>
</html>
