<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archiv Taranto</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe/dist/photoswipe.css">
    <style>
        :root { --primary: #ff4500; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: #fff; overflow: hidden; touch-action: none; }
        
        /* Viewport pro mapu */
        #viewport { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            overflow: hidden; 
            background: #e5e5e5;
            cursor: grab;
        }

        #wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            line-height: 0;
        }

        .map-image { 
            height: 100vh; 
            width: auto; 
            display: block;
            box-shadow: 0 0 50px rgba(0,0,0,0.2);
        }
        
        /* Hotspoty */
        .hotspot { 
            position: absolute; 
            width: 30px; 
            height: 30px; 
            background: rgba(255, 69, 0, 0.6); 
            border: 2px solid #000; 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 10;
            cursor: pointer;
        }
        .hotspot:active { background: #fff; }

        /* Onboarding / Nápověda */
        #hint-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; pointer-events: none; transition: opacity 0.6s;
        }
        .hint-card {
            background: #fff; padding: 20px; border: 3px solid #000; border-radius: 15px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .hint-icons { display: flex; gap: 20px; justify-content: center; margin-bottom: 10px; }
        .hint-icons img { width: 50px; height: 50px; }

        /* Zoom ovládání */
        .controls {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 80;
        }
        .btn {
            width: 50px; height: 50px; background: #fff; border: 2px solid #000;
            font-size: 24px; font-weight: bold; border-radius: 10px; cursor: pointer;
        }

        /* Galerie */
        #gallery-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 1000; overflow-y: auto; 
        }
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 10px; padding: 15px; margin-top: 70px; 
        }
        .thumb { border: 1px solid #000; background: #eee; position: relative; }
        .thumb img { width: 100%; height: 130px; object-fit: cover; display: block; }
        .close-btn { 
            position: fixed; top: 15px; right: 15px; width: 50px; height: 50px; 
            background: #000; color: #fff; border: none; border-radius: 50%; font-size: 30px; z-index: 1100;
        }
    </style>
</head>
<body>

    <div id="hint-overlay">
        <div class="hint-card">
            <div class="hint-icons">
                <img src="https://img.icons8.com/ios/100/pinch-zoom-in.png" alt="Zoom">
                <img src="https://img.icons8.com/ios/100/hand-drag.png" alt="Pan">
            </div>
            <div style="font-weight: bold; letter-spacing: 1px;">ZOOM & DRAG</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="manualZoom(1.5)">+</button>
        <button class="btn" onclick="manualZoom(0.7)">-</button>
    </div>

    <div id="viewport">
        <div id="wrapper">
            <img src="planek.jpg" class="map-image" id="mapImg">
            <div class="hotspot" style="top: 56%;left: 33%;" onclick="otevritMrizku('1mostotaceci')"></div>
            <div class="hotspot" style="top: 56%;left: 69%;" onclick="otevritMrizku('1novykostelamost')"></div>
            <div class="hotspot" style="top: 73%;left: 44%;" onclick="otevritMrizku('1okolibytu')"></div>
            <div class="hotspot" style="top: 60%;left: 41%;" onclick="otevritMrizku('1pesizona')"></div>
            <div class="hotspot" style="top: 63%;left: 35%;" onclick="otevritMrizku('1usoudu')"></div>
            <div class="hotspot" style="top: 63%;left: 50%;" onclick="otevritMrizku('1utrhu')"></div>
            <div class="hotspot" style="top: 51%;left: 37%;" onclick="otevritMrizku('1uparku')"></div>
            <div class="hotspot" style="top: 44%;left: 23%;" onclick="otevritMrizku('2kamennymost')"></div>
            <div class="hotspot" style="top: 48%;left: 28%;" onclick="otevritMrizku('2rybarskypristav')"></div>
            <div class="hotspot" style="top: 58%;left: 31%;" onclick="otevritMrizku('2uhradu')"></div>
            <div class="hotspot" style="top: 53%;left: 25%;" onclick="otevritMrizku('2vechia')"></div>
            <div class="hotspot" style="top: 38%;left: 21%;" onclick="otevritMrizku('3knadrazi')"></div>
            <div class="hotspot" style="top: 28%;left: 51%;" onclick="otevritMrizku('3malemore')"></div>
            <div class="hotspot" style="top: 29%;left: 23%;" onclick="otevritMrizku('3tamburi')"></div>
        </div>
    </div>

    <div id="gallery-overlay">
        <button class="close-btn" onclick="zavritMrizku()">×</button>
        <div class="grid" id="thumbnail-grid"></div>
    </div>

    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe/dist/photoswipe-lightbox.esm.js';

        const ZKRATKY = { 
            "1mostotaceci": "most", "1novykostelamost": "kost", "1okolibytu": "byt",
            "1pesizona": "pesi", "1usoudu": "soud", "1utrhu": "trh", "1uparku": "park",
            "2kamennymost": "kam", "2rybarskypristav": "ryb", "2uhradu": "hrad", "2vechia": "vech",
            "3knadrazi": "nad", "3malemore": "male", "3tamburi": "tam" 
        };

        // --- INTERAKTIVNÍ MAPA (ZOOM & PAN) ---
        let scale = 1, x = 0, y = 0;
        const viewport = document.getElementById('viewport');
        const wrapper = document.getElementById('wrapper');
        const hint = document.getElementById('hint-overlay');

        function update() {
            wrapper.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        }

        // Odstranění nápovědy při akci
        function hideHint() { hint.style.opacity = '0'; setTimeout(() => hint.remove(), 600); }

        // Ovládání myší a dotykem
        let isDragging = false, startX, startY;
        
        viewport.onpointerdown = e => { 
            hideHint();
            isDragging = true; 
            startX = e.clientX - x; 
            startY = e.clientY - y;
            viewport.style.cursor = 'grabbing';
        };
        
        window.onpointermove = e => {
            if (!isDragging) return;
            x = e.clientX - startX;
            y = e.clientY - startY;
            update();
        };

        window.onpointerup = () => { isDragging = false; viewport.style.cursor = 'grab'; };

        // Zoom kolečkem
        viewport.onwheel = e => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            manualZoom(delta, e.clientX, e.clientY);
        };

        window.manualZoom = (factor, centerX, centerY) => {
            hideHint();
            if (!centerX) { centerX = window.innerWidth / 2; centerY = window.innerHeight / 2; }
            const oldScale = scale;
            scale = Math.min(Math.max(1, scale * factor), 5);
            x = centerX - (centerX - x) * (scale / oldScale);
            y = centerY - (centerY - y) * (scale / oldScale);
            update();
        };

        // --- GALERIE ---
        window.otevritMrizku = async function(slozka) {
            const grid = document.getElementById('thumbnail-grid');
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center;">Loading Archive...</div>';
            document.getElementById('gallery-overlay').style.display = 'block';
            
            const zkratka = ZKRATKY[slozka];
            let fotkyArray = [];
            grid.innerHTML = '';

            for (let i = 1; i <= 250; i++) {
                const cislo = i.toString().padStart(3, '0');
                const base = `galerie/${slozka}/${cislo}${zkratka}`;
                let foundSrc = null;

                // Zkusíme všechny přípony
                for (let ext of ['.jpg', '.jpeg', '.png']) {
                    const check = await fetch(base + ext, { method: 'HEAD' });
                    if (check.ok) { foundSrc = base + ext; break; }
                }

                if (foundSrc) {
                    const img = new Image();
                    img.src = foundSrc;
                    await img.decode();
                    
                    const currentIdx = fotkyArray.length;
                    fotkyArray.push({ src: foundSrc, w: img.width, h: img.height });

                    const div = document.createElement('div');
                    div.className = 'thumb';
                    div.innerHTML = `<img src="${foundSrc}" loading="lazy">`;
                    div.onclick = () => {
                        const lightbox = new PhotoSwipeLightbox({
                            dataSource: fotkyArray,
                            pswpModule: () => import('https://unpkg.com/photoswipe/dist/photoswipe.esm.js')
                        });
                        lightbox.init();
                        lightbox.loadAndOpen(currentIdx);
                    };
                    grid.appendChild(div);
                } else if (i > 10 && i % 20 === 0) {
                    // Pokud už nic nenajdeme, složka pravděpodobně končí
                    break;
                }
            }
        };

        window.zavritMrizku = () => {
            document.getElementById('gallery-overlay').style.display = 'none';
        };
    </script>
</body>
</html>
