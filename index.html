<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archiv Taranto</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe/dist/photoswipe.css">
    <style>
        body { font-family: sans-serif; margin: 0; background: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Horní část s mapou */
        #viewport { 
            flex: 1; /* Zabere maximum místa nad legendou */
            position: relative; 
            overflow: hidden; 
            background: #f8f8f8;
            touch-action: none;
        }

        #wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        .map-image { 
            max-width: none;
            display: block;
        }
        
        .hotspot { 
            position: absolute; width: 30px; height: 30px; 
            background: rgba(210, 105, 30, 0.5); border: 2px solid #000; 
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 10;
        }

        /* Spodní legenda */
        .legend {
            padding: 15px;
            background: #fff;
            border-top: 2px solid #000;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            z-index: 200;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        .dot { width: 14px; height: 14px; background: rgba(210, 105, 30, 0.8); border: 1.5px solid #000; border-radius: 50%; }

        /* Tlačítka */
        .controls {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 8px; z-index: 100;
        }
        .btn {
            width: 45px; height: 45px; background: #f8f9fa; border: 1.5px solid #000;
            font-size: 24px; font-weight: 300; border-radius: 8px; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Galerie */
        #gallery-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 15px; margin-top: 60px; }
        .thumb { border: 1px solid #000; line-height: 0; }
        .thumb img { width: 100%; height: 140px; object-fit: cover; }
        .close-btn { position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; background: #000; color: #fff; border-radius: 50%; border: none; font-size: 24px; z-index: 1100; }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="wrapper">
            <img src="planek.jpg" class="map-image" id="mapImg">
            <div class="hotspot" style="top: 56%;left: 33%;" onclick="otevritMrizku('1mostotaceci')"></div>
            </div>

        <div class="controls">
            <button class="btn" onclick="zoomManual(1.5)">+</button>
            <button class="btn" onclick="zoomManual(0.6)">-</button>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item" onclick="otevritMrizku('4armada')"><div class="dot"></div> ARMÁDA</div>
        <div class="legend-item" onclick="otevritMrizku('4celkovepohledy')"><div class="dot"></div> CELKOVÉ POHLEDY</div>
        <div class="legend-item" onclick="otevritMrizku('1okolibytu')"><div class="dot"></div> OKOLÍ MĚSTA</div>
        <div class="legend-item" onclick="otevritMrizku('4nevim')"><div class="dot"></div> OSTATNÍ</div>
    </div>

    <div id="gallery-overlay">
        <button class="close-btn" onclick="zavritMrizku()">×</button>
        <div class="grid" id="thumbnail-grid"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe/dist/photoswipe-lightbox.esm.js';

        const ZKRATKY = { "1mostotaceci":"most", "4armada":"arm", "4celkovepohledy":"celk", "1okolibytu":"byt", "4nevim":"ost" };
        let scale = 1, x = 0, y = 0;
        const wrap = document.getElementById('wrapper');
        const mapImg = document.getElementById('mapImg');

        // Inicializace: Přizpůsobení mapy obrazovce
        mapImg.onload = () => {
            const vW = document.getElementById('viewport').clientWidth;
            const vH = document.getElementById('viewport').clientHeight;
            scale = Math.min(vW / mapImg.naturalWidth, vH / mapImg.naturalHeight);
            update();
        };

        function update() { wrap.style.transform = `translate(${x}px, ${y}px) scale(${scale})`; }

        // Gesta a Zoom (Ponecháno z minula, vyladěno na plynulost)
        const mc = new Hammer.Manager(document.getElementById('viewport'));
        mc.add(new Hammer.Pinch()); mc.add(new Hammer.Pan({ threshold: 0 }));
        mc.on("panmove", e => { wrap.style.transform = `translate(${x + e.deltaX}px, ${y + e.deltaY}px) scale(${scale})`; });
        mc.on("panend", e => { x += e.deltaX; y += e.deltaY; });
        mc.on("pinchmove", e => { 
            const s = Math.max(0.3, Math.min(scale * e.scale, 4));
            wrap.style.transform = `translate(${x}px, ${y}px) scale(${s})`; 
        });
        mc.on("pinchend", e => { scale = Math.max(0.3, Math.min(scale * e.scale, 4)); });

        window.zoomManual = (f) => {
            const oldS = scale; scale = Math.max(0.3, Math.min(scale * f, 4));
            const cX = document.getElementById('viewport').clientWidth / 2;
            const cY = document.getElementById('viewport').clientHeight / 2;
            x = cX - (cX - x) * (scale / oldS); y = cY - (cY - y) * (scale / oldS);
            update();
        };

        // Galerie (stejná logika jako dříve)
        window.otevritMrizku = async (sl) => { /* ... kód pro načtení galerie ... */ };
        window.zavritMrizku = () => document.getElementById('gallery-overlay').style.display = 'none';
    </script>
</body>
</html>
