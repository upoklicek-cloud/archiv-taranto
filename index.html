<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archiv Taranto</title>
    <link rel="stylesheet" href="https://unpkg.com/photoswipe/dist/photoswipe.css">
    <style>
        body { font-family: sans-serif; margin: 0; background: #fff; color: #000; overflow-x: hidden; }
        
        /* Viewport zabírá 70% výšky, zbytek je pro odkazy */
        #viewport { 
            width: 100vw; 
            height: 70vh; 
            position: relative; 
            overflow: hidden; 
            background: #f0f0f0;
            touch-action: none;
            border-bottom: 2px solid #000;
        }

        #wrapper {
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            line-height: 0;
        }

        /* Mapa se v základu přizpůsobí výšce viewportu, aby byla celá vidět */
        .map-image { 
            height: 70vh; 
            width: auto; 
            display: block;
        }
        
        .hotspot { 
            position: absolute; 
            width: 32px; height: 32px; 
            background: rgba(210, 105, 30, 0.5); 
            border: 2px solid #000; 
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 10;
        }

        /* Tlačítka +/- */
        .controls {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
        }
        .btn {
            width: 50px; height: 50px; background: #f8f9fa; border: 1.5px solid #000;
            font-size: 28px; font-weight: 300; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Odkazy pod plánkem */
        .links-section {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .link-card {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fdfdfd;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .link-card:active { background: #eee; }
        .link-card span { display: block; font-size: 12px; font-weight: normal; color: #666; }

        /* Galerie */
        #gallery-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 15px; margin-top: 60px; }
        .thumb { border: 1px solid #000; line-height: 0; }
        .thumb img { width: 100%; height: 140px; object-fit: cover; }
        .close-btn { position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; background: #000; color: #fff; border-radius: 50%; border: none; font-size: 24px; z-index: 1100; }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="controls">
            <button class="btn" onclick="zoomManual(1.4)">+</button>
            <button class="btn" onclick="zoomManual(0.7)">-</button>
        </div>

        <div id="wrapper">
            <img src="planek.jpg" class="map-image" id="mapImg">
            <div class="hotspot" style="top: 56%;left: 33%;" onclick="otevritMrizku('1mostotaceci')"></div>
            <div class="hotspot" style="top: 56%;left: 69%;" onclick="otevritMrizku('1novykostelamost')"></div>
            <div class="hotspot" style="top: 73%;left: 44%;" onclick="otevritMrizku('1okolibytu')"></div>
            <div class="hotspot" style="top: 60%;left: 41%;" onclick="otevritMrizku('1pesizona')"></div>
            <div class="hotspot" style="top: 63%;left: 35%;" onclick="otevritMrizku('1usoudu')"></div>
            <div class="hotspot" style="top: 63%;left: 50%;" onclick="otevritMrizku('1utrhu')"></div>
            <div class="hotspot" style="top: 51%;left: 37%;" onclick="otevritMrizku('1uparku')"></div>
            <div class="hotspot" style="top: 44%;left: 23%;" onclick="otevritMrizku('2kamennymost')"></div>
            <div class="hotspot" style="top: 48%;left: 28%;" onclick="otevritMrizku('2rybarskypristav')"></div>
            <div class="hotspot" style="top: 58%;left: 31%;" onclick="otevritMrizku('2uhradu')"></div>
            <div class="hotspot" style="top: 53%;left: 25%;" onclick="otevritMrizku('2vechia')"></div>
            <div class="hotspot" style="top: 38%;left: 21%;" onclick="otevritMrizku('3knadrazi')"></div>
            <div class="hotspot" style="top: 28%;left: 51%;" onclick="otevritMrizku('3malemore')"></div>
            <div class="hotspot" style="top: 29%;left: 23%;" onclick="otevritMrizku('3tamburi')"></div>
        </div>
    </div>

    <div class="links-section">
        <div class="link-card" onclick="otevritMrizku('1mostotaceci')">Most Otočný <span>Bridge</span></div>
        <div class="link-card" onclick="otevritMrizku('1novykostelamost')">Nový kostel <span>Church</span></div>
        <div class="link-card" onclick="otevritMrizku('1okolibytu')">Okolí bytu <span>Apartment</span></div>
        <div class="link-card" onclick="otevritMrizku('4armada')">Armáda <span>Army</span></div>
        <div class="link-card" onclick="otevritMrizku('4celkovepohledy')">Celkové pohledy <span>Views</span></div>
        <div class="link-card" onclick="otevritMrizku('4nevim')">Ostatní <span>Other</span></div>
    </div>

    <div id="gallery-overlay">
        <button class="close-btn" onclick="zavritMrizku()">×</button>
        <div class="grid" id="thumbnail-grid"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe/dist/photoswipe-lightbox.esm.js';

        const ZKRATKY = { 
            "1mostotaceci":"most", "1novykostelamost":"kost", "1okolibytu":"byt", "1pesizona":"pesi", 
            "1usoudu":"soud", "1utrhu":"trh", "1uparku":"park", "2kamennymost":"kam", 
            "2rybarskypristav":"ryb", "2uhradu":"hrad", "2vechia":"vech", "3knadrazi":"nad", 
            "3malemore":"male", "3tamburi":"tam", "4armada":"arm", "4celkovepohledy":"celk", "4nevim":"ost"
        };

        let scale = 1, x = 0, y = 0;
        const wrap = document.getElementById('wrapper');
        const view = document.getElementById('viewport');

        const mc = new Hammer.Manager(view);
        mc.add(new Hammer.Pinch());
        mc.add(new Hammer.Pan({ threshold: 0 }));

        mc.on("panmove", (e) => {
            wrap.style.transform = `translate(${x + e.deltaX}px, ${y + e.deltaY}px) scale(${scale})`;
        });
        mc.on("panend", (e) => { x += e.deltaX; y += e.deltaY; });
        mc.on("pinchmove", (e) => {
            const currentScale = Math.max(0.5, Math.min(scale * e.scale, 5));
            wrap.style.transform = `translate(${x}px, ${y}px) scale(${currentScale})`;
        });
        mc.on("pinchend", (e) => { scale = Math.max(0.5, Math.min(scale * e.scale, 5)); });

        window.zoomManual = (factor) => {
            const oldScale = scale;
            scale = Math.max(0.5, Math.min(scale * factor, 5));
            const centerX = view.clientWidth / 2;
            const centerY = view.clientHeight / 2;
            x = centerX - (centerX - x) * (scale / oldScale);
            y = centerY - (centerY - y) * (scale / oldScale);
            wrap.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        };

        window.otevritMrizku = async function(slozka) {
            const grid = document.getElementById('thumbnail-grid');
            grid.innerHTML = 'Načítám...';
            document.getElementById('gallery-overlay').style.display = 'block';
            const zk = ZKRATKY[slozka];
            let fotky = [];
            grid.innerHTML = '';

            for (let i = 1; i <= 250; i++) {
                const c = i.toString().padStart(3, '0');
                const base = `galerie/${slozka}/${c}${zk}`;
                let src = null;
                for (let ext of ['.jpg', '.png', '.jpeg']) {
                    const h = await fetch(base + ext, { method: 'HEAD' });
                    if (h.ok) { src = base + ext; break; }
                }
                if (src) {
                    const img = new Image();
                    img.src = src;
                    const idx = fotky.length;
                    fotky.push({ src: src, w: 1200, h: 900 });
                    const d = document.createElement('div');
                    d.className = 'thumb';
                    d.innerHTML = `<img src="${src}" loading="lazy">`;
                    d.onclick = () => {
                        const lb = new PhotoSwipeLightbox({
                            dataSource: fotky,
                            pswpModule: () => import('https://unpkg.com/photoswipe/dist/photoswipe.esm.js')
                        });
                        lb.init(); lb.loadAndOpen(idx);
                    };
                    grid.appendChild(d);
                } else if (i > 15 && i % 25 === 0) break;
            }
        };

        window.zavritMrizku = () => document.getElementById('gallery-overlay').style.display = 'none';
    </script>
</body>
</html>
