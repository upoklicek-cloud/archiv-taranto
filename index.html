<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archiv Taranto</title>
    
    <link rel="stylesheet" href="https://unpkg.com/photoswipe/dist/photoswipe.css">
    
    <style>
        /* ZÁKLADNÍ NASTAVENÍ */
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            background: #ffffff; 
            color: #000; 
            text-align: center; 
            overflow: hidden; /* Zamezíme posunu celé stránky, posouváme jen wrapper */
            touch-action: none; 
        }
        
        /* KONTEJNER PRO MAPU - umožňuje posouvání */
        .map-scroll-wrapper { 
            width: 100vw; 
            height: 100vh; 
            overflow: auto; 
            -webkit-overflow-scrolling: touch; 
            position: relative;
        }
        
        /* SESTAVA MAPY A BODŮ */
        .content-assembly { 
            display: block; 
            position: relative; 
            transform-origin: 0 0; /* Zoomování probíhá z levého horního rohu */
        }

        .map-paper { 
            position: relative; 
            display: block; 
            margin: 0; 
            background: #fff; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            width: 1040px; /* Šířka tvého plánku */
        }

        .map-image { 
            width: 100%; 
            display: block; 
            height: auto; 
            pointer-events: none; 
        }

        /* OVLÁDÁNÍ ZOOMU */
        .zoom-controls { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            z-index: 150; 
        }
        
        .zoom-btn { 
            width: 50px; 
            height: 50px; 
            background: rgba(255,255,255,0.95); 
            color: #000; 
            border: 2px solid #000; 
            font-size: 26px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* HOTSPOTY */
        .hotspot { 
            position: absolute; 
            width: 32px; 
            height: 32px; 
            background: rgba(255, 69, 0, 0.5); 
            border: 2px solid #000; 
            border-radius: 50%; 
            cursor: pointer; 
            transform: translate(-50%, -50%); 
            z-index: 10; 
        }
        
        .hotspot.visited { 
            background: rgba(128, 128, 128, 0.6) !important; 
        }

        /* DODATEČNÉ GALERIE DOLE */
        .extra-galleries { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 15px; 
            padding: 40px 20px; 
            background: #fff;
        }
        
        .extra-btn { 
            background: none; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            text-transform: uppercase;
            font-size: 14px;
        }
        
        .btn-dot { 
            width: 12px; 
            height: 12px; 
            background: rgba(255, 69, 0, 0.6); 
            border: 1px solid #000; 
            border-radius: 50%; 
            margin-right: 8px; 
        }

        /* MŘÍŽKA GALERIE */
        #gallery-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: #ffffff; 
            z-index: 1000; 
            overflow-y: auto; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
            max-width: 1100px; 
            margin: 60px auto; 
            padding: 20px; 
        }
        
        .thumb-slot { 
            aspect-ratio: 1/1;
            background: #f0f0f0; /* Šedý čtverec, než se načte fotka */
            border: 1px solid #000; 
            cursor: pointer;
            overflow: hidden;
            display: none; /* Schováme slot, dokud v něm není fotka */
        }
        
        .thumb-slot img { 
            width: 100%; height: 100%; object-fit: cover; 
        }
        
        .close-btn { 
            position: fixed; top: 15px; right: 15px; 
            background: #000; color: #fff; border: none; 
            width: 45px; height: 45px; border-radius: 50%; 
            cursor: pointer; font-size: 28px; z-index: 2000; 
        }
    </style>
</head>
<body>

    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zmenitZoom(0.2)">+</button>
        <button class="zoom-btn" onclick="zmenitZoom(-0.2)">−</button>
    </div>

    <div class="map-scroll-wrapper" id="mapWrapper">
        <div class="content-assembly" id="assembly">
            <div class="map-paper" id="mapa">
                <img src="planek.jpg" class="map-image" id="mapImage">
                
                <div id="pt1" class="hotspot" style="top: 56%;left: 33%;" onclick="otevritMrizku('1mostotaceci', 'pt1')"></div>
                <div id="pt2" class="hotspot" style="top: 56%;left: 69%;" onclick="otevritMrizku('1novykostelamost', 'pt2')"></div>
                <div id="pt3" class="hotspot" style="top: 73%;left: 44%;" onclick="otevritMrizku('1okolibytu', 'pt3')"></div>
                <div id="pt4" class="hotspot" style="top: 60%;left: 41%;" onclick="otevritMrizku('1pesizona', 'pt4')"></div>
                <div id="pt5" class="hotspot" style="top: 63%;left: 35%;" onclick="otevritMrizku('1usoudu', 'pt5')"></div>
                <div id="pt6" class="hotspot" style="top: 63%;left: 50%;" onclick="otevritMrizku('1utrhu', 'pt6')"></div>
                <div id="pt7" class="hotspot" style="top: 51%;left: 37%;" onclick="otevritMrizku('1uparku', 'pt7')"></div>
                <div id="pt8" class="hotspot" style="top: 44%;left: 23%;" onclick="otevritMrizku('2kamennymost', 'pt8')"></div>
                <div id="pt9" class="hotspot" style="top: 48%;left: 28%;" onclick="otevritMrizku('2rybarskypristav', 'pt9')"></div>
                <div id="pt10" class="hotspot" style="top: 58%;left: 31%;" onclick="otevritMrizku('2uhradu', 'pt10')"></div>
                <div id="pt11" class="hotspot" style="top: 53%;left: 25%;" onclick="otevritMrizku('2vechia', 'pt11')"></div>
                <div id="pt12" class="hotspot" style="top: 38%;left: 21%;" onclick="otevritMrizku('3knadrazi', 'pt12')"></div>
                <div id="pt13" class="hotspot" style="top: 28%;left: 51%;" onclick="otevritMrizku('3malemore', 'pt13')"></div>
                <div id="pt14" class="hotspot" style="top: 29%;left: 23%;" onclick="otevritMrizku('3tamburi', 'pt14')"></div>
            </div>

            <div class="extra-galleries">
                <div id="ex1" class="extra-btn" onclick="otevritMrizku('4armada', 'ex1')"><span class="btn-dot"></span>Armáda</div>
                <div id="ex2" class="extra-btn" onclick="otevritMrizku('4celkovepohledy', 'ex2')"><span class="btn-dot"></span>Celkové pohledy</div>
                <div id="ex3" class="extra-btn" onclick="otevritMrizku('4okolmesta', 'ex3')"><span class="btn-dot"></span>Okolí města</div>
                <div id="ex4" class="extra-btn" onclick="otevritMrizku('4nevim', 'ex4')"><span class="btn-dot"></span>Ostatní</div>
            </div>
        </div>
    </div>

    <div id="gallery-overlay">
        <button class="close-btn" onclick="zavritMrizku()">×</button>
        <div class="grid" id="thumbnail-grid"></div>
    </div>

    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe/dist/photoswipe-lightbox.esm.js';

        let aktualniZoom = 1.0;
        const mapaEl = document.getElementById('mapa');
        const assembly = document.getElementById('assembly');
        const wrapper = document.getElementById('mapWrapper');

        // FUNKCE PRO ÚPRAVU ZOOMU A POSUVU
        function aktualizovatVelikost() {
            assembly.style.transform = `scale(${aktualniZoom})`;
            assembly.style.width = (1040 * aktualniZoom) + 'px';
            assembly.style.height = (mapaEl.offsetHeight * aktualniZoom) + 'px';
        }

        window.zmenitZoom = function(zmena) {
            aktualniZoom = Math.max(0.4, Math.min(2.5, aktualniZoom + zmena));
            aktualizovatVelikost();
        };

        // 1. KROK: VYCENTROVÁNÍ NA ETIKETU PŘI STARTU
        window.addEventListener('load', () => {
            // Počkáme chvilku, než prohlížeč vykreslí obrázek
            setTimeout(() => {
                const etiketaX = 200; // Přibližná poloha etikety na plánku (X)
                const etiketaY = 820; // Přibližná poloha etikety na plánku (Y)

                // Výpočet posunu pro střed displeje
                const scrollX = etiketaX - (window.innerWidth / 2);
                const scrollY = etiketaY - (window.innerHeight / 1.5);

                wrapper.scrollLeft = scrollX;
                wrapper.scrollTop = scrollY;
            }, 100);
        });

        // 2. KROK: ŽIVÉ NAČÍTÁNÍ GALERIE
        const ZKRATKY = { 
            "1mostotaceci": "most", "1novykostelamost": "kost", "1okolibytu": "byt", 
            "1pesizona": "pesi", "1usoudu": "soud", "1utrhu": "trh", "1uparku": "park", 
            "2kamennymost": "kam", "2rybarskypristav": "ryb", "2uhradu": "hrad", 
            "2vechia": "vech", "3knadrazi": "nad", "3malemore": "male", "3tamburi": "tam", 
            "4armada": "arm", "4celkovepohledy": "celk", "4okolmesta": "okol", "4nevim": "ost" 
        };

        let fotkyArray = [];

        window.otevritMrizku = async function(slozka, idBodu) {
            const overlay = document.getElementById('gallery-overlay');
            const grid = document.getElementById('thumbnail-grid');
            
            if(idBodu) document.getElementById(idBodu).classList.add('visited');

            grid.innerHTML = ''; // Vyčistíme mřížku
            fotkyArray = []; // Resetujeme seznam fotek pro PhotoSwipe
            overlay.style.display = 'block';
            history.pushState({ galleryOpen: true }, "");

            const zkratka = ZKRATKY[slozka] || "";

            // Spustíme hledání všech 250 možných fotek naráz
            for (let i = 1; i <= 250; i++) {
                const cislo = i.toString().padStart(3, '0');
                const imgPath = `galerie/${slozka}/${cislo}${zkratka}.jpg`;
                
                // Vytvoříme neviditelný slot v mřížce (udržuje pořadí)
                const slot = document.createElement('div');
                slot.className = 'thumb-slot';
                slot.id = `slot-${cislo}`;
                grid.appendChild(slot);

                // Zkusíme načíst obrázek
                const img = new Image();
                img.onload = () => {
                    // Jakmile se načte, vložíme ho do slotu a slot zobrazíme
                    slot.innerHTML = `<img src="${imgPath}" loading="lazy">`;
                    slot.style.display = 'block';
                    
                    // Přidáme do seznamu pro PhotoSwipe a seřadíme podle čísel
                    fotkyArray.push({ src: imgPath, w: img.naturalWidth, h: img.naturalHeight, name: cislo });
                    fotkyArray.sort((a, b) => a.name.localeCompare(b.name));
                    
                    // Kliknutím na slot se otevře velký náhled
                    slot.onclick = () => {
                        const indexVFotkach = fotkyArray.findIndex(f => f.src === imgPath);
                        spustitLightbox(indexVFotkach);
                    };
                };
                img.onerror = () => {
                    // Pokud fotka neexistuje, slot smažeme
                    slot.remove();
                };
                img.src = imgPath;
            }
        };

        window.zavritMrizku = function(fromPopState = false) {
            document.getElementById('gallery-overlay').style.display = 'none';
            if (!fromPopState && history.state && history.state.galleryOpen) history.back();
        };

        window.onpopstate = () => zavritMrizku(true);

        function spustitLightbox(index) {
            const lightbox = new PhotoSwipeLightbox({
                dataSource: fotkyArray,
                pswpModule: () => import('https://unpkg.com/photoswipe/dist/photoswipe.esm.js')
            });
            lightbox.init(); 
            lightbox.loadAndOpen(index);
        }

        // PINCH-TO-ZOOM GESTA (pro mobil)
        let pocatecniDist = 0;
        let pocatecniZoom = 1.0;

        wrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                pocatecniDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                pocatecniZoom = aktualniZoom;
            }
        }, { passive: true });

        wrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const ratio = dist / pocatecniDist;
                aktualniZoom = Math.max(0.4, Math.min(2.5, pocatecniZoom * ratio));
                aktualizovatVelikost();
            }
        }, { passive: true });
    </script>
</body>
</html>
